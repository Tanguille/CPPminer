name: Build RTX 2070 canary

on:
  push:
    branches: [canary/const64-sm75]

jobs:
  build:
    if: github.repository == 'Tanguille/CPPminer'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.sm75
          platforms: linux/amd64
          push: true
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: ghcr.io/tanguille/cppminer:sm75-const64-${{ github.sha }}
      - name: Verify published manifest and smoke-test the packaged CLI
        env:
          IMAGE: ghcr.io/tanguille/cppminer:sm75-const64-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref"
          docker pull --platform linux/amd64 "$ref"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --read-only --network none "$ref" --help > /tmp/cppminer-help
          grep -q -- '--mock' /tmp/cppminer-help
          echo "\`$ref\`" >> "$GITHUB_STEP_SUMMARY"
