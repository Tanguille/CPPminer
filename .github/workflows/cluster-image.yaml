name: cluster-image

on:
  # a push to this dedicated branch builds; the workflow is not on the default branch, so dispatch is not registered until it merges
  push:
    branches: [ci/cluster-image]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit sha to build; must be on blackwell-tensor and not on local-no-dev-fee
        required: false

env:
  VERSION: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Guard source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          # the image commit sits on top of blackwell-tensor, so the branch must be its ancestor
          git merge-base --is-ancestor origin/blackwell-tensor "$SOURCE_SHA"
          # local-no-dev-fee is unpublished, so the ref normally does not exist here
          if git rev-parse --verify -q origin/local-no-dev-fee; then
            ! git merge-base --is-ancestor "$SOURCE_SHA" origin/local-no-dev-fee
          fi

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha
        run: echo "SHORT=${SOURCE_SHA::7}" >> "$GITHUB_ENV"
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          build-args: SOURCE_SHA=${{ inputs.source_sha || github.sha }}
          tags: ghcr.io/tanguille/cppminer:${{ env.VERSION }}-${{ env.SHORT }}

      - name: Digest
        run: echo "ghcr.io/tanguille/cppminer:${VERSION}-${SHORT}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
