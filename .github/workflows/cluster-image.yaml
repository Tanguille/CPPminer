name: cluster-image

# Builds the latest upstream release (1640675651/CPPminer) with the developer fee
# disabled and pushes ghcr.io/tanguille/cppminer:<version> (plain, so Renovate can order tags).
# This branch holds only the overlay (Dockerfile + workflow); upstream is cloned
# at build time, so there is nothing to merge or rebase when upstream moves.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (default is the newest vX.Y[.Z])
        required: false
      force:
        description: Rebuild even if the image tag already exists
        type: boolean
        default: false

env:
  UPSTREAM: https://github.com/1640675651/CPPminer
  IMAGE: ghcr.io/tanguille/cppminer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: overlay

      - name: Resolve upstream tag
        env:
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${WANT:-$(git ls-remote --tags --refs "$UPSTREAM" 'v*' | awk '{sub("refs/tags/","",$2); print $2}' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)}"
          [ -n "$tag" ]
          git clone --quiet --depth 1 --branch "$tag" "$UPSTREAM" src
          sha="$(git -C src rev-parse HEAD)"
          {
            echo "UPSTREAM_TAG=$tag"
            echo "SOURCE_SHA=$sha"
            echo "IMAGE_TAG=${tag#v}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when already built
        id: exists
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != true ] && docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$IMAGE_TAG exists, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable the developer fee
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # main.cpp enables the fee unless the run is offline; force it off.
          # Fails if upstream rewrote the line, so a silent fee-on build cannot ship.
          sed -i 's/cp_fee_init(wallet_global, offline ? 0 : 1,/cp_fee_init(wallet_global, 0,/' src/src/common/main.cpp
          grep -q 'cp_fee_init(wallet_global, 0,' src/src/common/main.cpp
          cp overlay/Dockerfile src/Dockerfile

      - name: Generate cp_version.h if upstream forgot to commit it
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # upstream v1.1 includes cp_version.h from 4 sources but never committed it;
          # this does nothing once a tag ships the file
          [ -f src/include/cp_version.h ] && exit 0
          ver="${UPSTREAM_TAG#v}"
          printf '#define CP_VERSION "%s"\n#define CP_AGENT_DEFAULT "CPPminer/%s"\n' "$ver" "$ver" > src/include/cp_version.h

      - id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: src
          push: true
          build-args: |
            SOURCE_SHA=${{ env.SOURCE_SHA }}
            UPSTREAM_TAG=${{ env.UPSTREAM_TAG }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Digest
        if: steps.exists.outputs.skip != 'true'
        run: echo "${IMAGE}:${IMAGE_TAG}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
